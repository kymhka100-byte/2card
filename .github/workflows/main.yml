name: Build APK
# main.py, bu .github/workflows/build.yml


on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 자바 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 필요한 프로그램 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: buildozer 설치
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 "cython==0.29.36" setuptools wheel

      - name: APK 빌드
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: 에러 요약 (실패했을 때만 여기를 보세요)
        if: failure()
        run: |
          echo "===== 에러 관련 줄 ====="
          grep -n -i -E "error|failed|exception|not found" build.log | tail -n 30 || true
          echo "===== 로그 마지막 40줄 ====="
          tail -n 40 build.log

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: memorycard-apk
          path: bin/*.apk
          if-no-files-found: error
